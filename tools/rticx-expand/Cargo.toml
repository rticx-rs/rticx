[package]
name = "rticx-expand"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Expands RTICX applications into plain Rust for GDB debugging, inspection, and security vetting"
keywords = ["rtic", "rticx", "proc-macro", "embedded", "debugging"]
categories = ["development-tools", "embedded"]
readme = "README.md"

[[bin]]
name = "cargo-rticx-expand"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
