[package]
name = "rticx-riscv-macro"
version = "0.1.0"
edition = "2024"
authors = ["Zakaria Madaoui"]
description = "Proc-macro crate for the RTICX RISC-V distribution"
license = "MIT"
repository = "https://github.com/rticx-rs/rticx"
homepage = "https://github.com/rticx-rs/rticx/wiki"
keywords = ["rtic", "rticx", "risc-v", "proc-macro", "embedded"]
categories = ["no-std", "embedded"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.79"
quote = "1.0.35"
rticx-core = { version = "0.1.0", path = "../../../rticx-core" }
syn = { version = "2.0.52", features = ["extra-traits", "full"] }
rticx-sw-pass = { version = "0.1.0", path = "../../../compilation-passes/rticx-sw-pass", features = [
    "proc-macro",
] }

[features]
default = ["swtasks"]

# Enable software tasks pass (spawn / spawn_dispatch).
swtasks = []

# --- Target selector features (mirror the parent `rticx-riscv` crate) ---------
# These are pure cfg gates used by the proc-macro to pick the right
# `CorePassBackend` + `SwPassBackend` implementation. They carry no
# dependencies of their own: the actual runtime dependencies live in the
# library crate.
slic = []
esp32c3 = []
esp32c6 = []
