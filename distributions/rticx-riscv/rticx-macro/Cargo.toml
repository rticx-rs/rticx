[package]
name = "rticx-riscv-macro"
version.workspace = true
edition = "2024"
authors = ["Zakaria Madaoui"]
description = "Proc-macro crate for the RTICX RISC-V distribution"
license = "MIT"
repository = "https://github.com/rticx-rs/rticx"
homepage = "https://github.com/rticx-rs/rticx/wiki"
keywords = ["rtic", "rticx", "risc-v", "proc-macro", "embedded"]
categories = ["no-std", "embedded"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.79"
quote = "1.0.35"
rticx-core = { version = "0.2.0", path = "../../../rticx-core" }
syn = { version = "2.0.52", features = ["extra-traits", "full"] }
rticx-sw-pass = { version = "0.2.0", path = "../../../compilation-passes/rticx-sw-pass" }
rticx-async-pass = { version = "0.2.0", path = "../../../compilation-passes/rticx-async-pass" }

[features]

slic = []
mecall-backend = ["slic"]
clint-backend = ["slic"]

esp32c3 = []
esp32c6 = []


# Enable simple software tasks (rticx-sw-pass).
# Mutually exclusive with `swtasks`.
swtasks = []

# Enable async/await software tasks (rticx-async-pass).
# Mutually exclusive with `swtasks`.
async = []

