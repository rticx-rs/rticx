[package]
name = "rticx-hippo-macro"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.79"
quote = "1.0.35"
rticx-core = { path = "../../../rticx-core" }
# rticx-core = { path = "../../rticx-core", features = ["debug_expand"] }
syn = { version = "2.0.52", features = ["extra-traits", "full"] }
rticx-sw-pass = { path = "../../../compilation-passes/rticx-sw-pass", features = [
    "proc-macro",
] }
rticx-deadline-pass = { path = "../../../compilation-passes/rticx-deadline-pass", features = [
    "proc-macro",
] }

[features]
deadline-pass = []
