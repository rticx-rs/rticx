[package]
name = "rticx_cortex_m_example_armv7m"
version = "0.1.0"
edition = "2024"
publish = false

[[example]]
name = "hello_rtic"
path = "examples/hello_rtic.rs"
required-features = ["swtasks"]

[[example]]
name = "sw_queue_depth"
path = "examples/sw_queue_depth.rs"
required-features = ["swtasks"]

[[example]]
name = "async_ping_pong"
path = "examples/async_ping_pong.rs"
required-features = ["async"]

[[example]]
name = "async_queue_depth"
path = "examples/async_queue_depth.rs"
required-features = ["async"]

[dependencies]
rticx-cortex-m = { path = "../.." }
rticx-async = { path = "../../../../rticx-async", optional = true }
cortex-m = "0.7.8"
cortex-m-rt = "0.7.3"
cortex-m-semihosting = "0.5.0"
panic-halt = "0.2.0"
# Bare PAC for STM32F030 (31 NVIC IRQs, fits QEMU's lm3s6965evb/Cortex-M3 vector table).
# We use the same PAC for both the armv7m and armv6m example apps so that the
# only differences between the two are the build target and the `armv6m` RTIC feature
stm32f0 = { version = "0.15.1", features = ["stm32f0x0", "rt"] }
rtic-monotonics = { version = "2.2.1", features = ["cortex-m-systick"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"


[features]
async = ["rticx-cortex-m/async", "dep:rticx-async"]
swtasks = ["rticx-cortex-m/swtasks"]
