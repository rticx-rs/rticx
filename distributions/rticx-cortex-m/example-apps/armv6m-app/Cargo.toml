[package]
name = "rticx_cortex_m_example_armv6m"
version = "0.1.0"
edition = "2024"
publish = false

[[example]]
name = "hello_rtic"
path = "examples/hello_rtic.rs"

[[example]]
name = "async_ping_pong"
path = "../armv7m-app/examples/async_ping_pong.rs"
required-features = ["asynctasks"]

[features]
asynctasks = ["rticx-cortex-m/asynctasks", "dep:rticx-async"]

[dependencies]
# `armv6m` selects interrupt source-masking locking (Cortex-M0/M0+/M23).
rticx-cortex-m = { path = "../..", features = ["armv6m"] }
rticx-async = { path = "../../../../rticx-async", optional = true }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
cortex-m-semihosting = "0.5.0"
panic-halt = "0.2.0"
# Bare PAC for STM32F030 (Cortex-M0 / armv6-m, 31 IRQs, 2 priority bits).
# Same PAC as the armv7m-app; only the target triple and the `armv6m` RTIC
# feature differ between the two examples.
stm32f0 = { version = "0.15.1", features = ["stm32f0x0", "rt"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
