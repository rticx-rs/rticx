[package]
name = "rticx-cortex-m"
version = "0.2.0"
edition = "2024"
authors = ["Zakaria Madaoui"]
description = "RTICX distribution for single-core Cortex-M targets (armv6-m and armv7-m and above)"
license = "MIT"
repository = "https://github.com/rticx-rs/rticx"
homepage = "https://github.com/rticx-rs/rticx/wiki"
keywords = ["rtic", "rticx", "cortex-m", "arm", "embedded"]
categories = ["no-std", "embedded"]
readme = "README.md"

[lib]
test = false
bench = false

[dependencies]
cortex-m = "0.7.8"
rticx-cortex-m-macro = { version = "0.2.0", path = "rticx-macro" }
rticx-async = { version = "0.2.0", path = "../../rticx-async", optional = true }
rticx-spsc = { version = "0.2.0", path = "../../rticx-spsc" }

[features]
# Use interrupt source-masking for locking (armv6-m: Cortex-M0/M0+/M23).
# When disabled (default), BASEPRI-based locking is used (armv7-m and above).
armv6m = ["rticx-cortex-m-macro/armv6m", "rticx-async/atomic-critical-section"]
# Software tasks pass. Mutually exclusive with `async`
swtasks = ["rticx-cortex-m-macro/swtasks"]
# Async/await software tasks support (rticx-async-pass). Mutually exclusive with `swtasks`.
async = [
    "rticx-cortex-m-macro/async",
    "dep:rticx-async",
    "cortex-m/critical-section-single-core",
]
