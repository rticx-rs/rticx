[package]
name = "async_multitasker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "async_multitasker"
test = false
bench = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
defmt = "0.3"
defmt-rtt = "0.4"
# panic-probe = { version = "0.3", features = ["print-defmt"] }
embedded-hal = "0.2.7"
fugit = "0.3.7"
heapless = "0.8.0"
rp-pico = { version = "0.8.0", features = ["boot2"] }
rp2040-boot2 = "0.3.0"
rp2040-hal = "0.9.1"
rticx-rp2040 = { path = "../../", features = ["async"] }
rticx-async = { path = "../../../../rticx-async" }
itoa = "1.0.11"
base64 = { version = "0.22.1", default-features = false }
panic-halt = "0.2.0"
