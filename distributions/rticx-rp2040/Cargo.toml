[package]
name = "rticx-rp2040"
version = "0.2.0"
edition = "2024"
authors = ["Zakaria Madaoui"]
description = "RTICX distribution for the Raspberry Pi Pico / RP2040 dual-core Cortex-M0+"
license = "MIT"
repository = "https://github.com/rticx-rs/rticx"
homepage = "https://github.com/rticx-rs/rticx/wiki"
keywords = ["rtic", "rticx", "rp2040", "raspberry-pi-pico", "embedded"]
categories = ["no-std", "embedded"]
readme = "README.md"

[lib]
test = false
bench = false

[dependencies]
cortex-m = "0.7.8"
rticx-rp2040-macro = { version = "0.2.0", path = "rticx-rp2040-macro" }
rticx-async = { version = "0.2.0", path = "../../rticx-async", optional = true }
rticx-spsc = { version = "0.2.0", path = "../../rticx-spsc" }
rp2040-hal = { version = "0.10.2" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(have_basepri)'] }

[features]
autoassign = ["rticx-rp2040-macro/autoassign"]
# Software tasks pass. Mutually exclusive with `async`
swtasks = ["rticx-rp2040-macro/swtasks"]
# Async/await software tasks support. Mutually exclusive with `swtasks`.
async = [
    "rticx-rp2040-macro/async",
    "dep:rticx-async",
    "rticx-async/atomic-critical-section",
    "rp2040-hal/critical-section-impl",    # use a critical section implementation that is multicore safe. This is necessary for the atomics used by rticx-async to work correctly
]
