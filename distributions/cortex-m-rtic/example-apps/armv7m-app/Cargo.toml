[package]
name = "cortex_m_rtic_example_armv7m"
version = "0.1.0"
edition = "2024"
publish = false

[[example]]
name = "hello_rtic"
path = "examples/hello_rtic.rs"

[dependencies]
# default features: swtasks on, BASEPRI locking (armv7-m)
rtic = { path = "../.." }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
# Bare PAC (STM32F103). The PAC is target-agnostic register defs + vector table (`rt` feature).
stm32f1 = { version = "0.15.1", features = ["stm32f103", "rt"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"