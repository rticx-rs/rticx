[package]
name = "cortex-m-rtic"
version = "0.1.0-cortex-m"
edition = "2024"
authors = ["Zakaria Madaoui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
test = false
bench = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rtic-macro = { path = "rtic-macro" }
rtic-sw-pass = { path = "../../compilation-passes/rtic-sw-pass" } # exports

[features]
default = ["swtasks"]
# Software tasks pass (enabled by default; disable to use a hardware-only distribution)
swtasks = ["cortex-m-rtic-macro/swtasks"]
# Use interrupt source-masking for locking (armv6-m: Cortex-M0/M0+/M23).
# When disabled (default), BASEPRI-based locking is used (armv7-m and above).
armv6m = ["cortex-m-rtic-macro/armv6m"]