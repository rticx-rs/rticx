[package]
name = "rticx-async-pass"
version = "0.1.0"
edition = "2024"
authors = ["Zakaria Madaoui"]
description = "Async tasks compilation pass for the RTICX real-time concurrency framework"
license = "MIT"
repository = "https://github.com/rticx-rs/rticx"
homepage = "https://github.com/rticx-rs/rticx/wiki"
keywords = ["rtic", "rticx", "async", "embedded", "concurrency"]
categories = ["no-std", "embedded"]
readme = "README.md"

[dependencies]
heck = { version = "0.5.0" }
proc-macro2 = { version = "1.0.79" }
quote = { version = "1.0.35" }
syn = { version = "2.0.53", features = ["extra-traits", "full"] }
rticx-core = { version = "0.1.0", path = "../../rticx-core" }

[dev-dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["extra-traits", "full"] }
