[package]
name = "rticx-deadline-pass"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Converts `deadline = D` task arguments into priorities (reference pass, unpublished)"
keywords = ["rtic", "rticx", "deadline", "embedded", "concurrency"]
categories = ["no-std", "embedded"]
publish = false

[dependencies]
heck = { version = "0.5.0" }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
rticx-core = { workspace = true }

[dev-dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["extra-traits", "full"] }
