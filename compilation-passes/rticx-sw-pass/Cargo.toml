[package]
name = "rticx-sw-pass"
version = "0.2.0"
edition = "2024"
authors = ["Zakaria Madaoui"]
description = "Software tasks compilation pass for the RTICX framework: dispatchers, message queues, spawn, spawn_from"
license = "MIT"
repository = "https://github.com/rticx-rs/rticx"
homepage = "https://github.com/rticx-rs/rticx/wiki"
keywords = ["rtic", "rticx", "software-tasks", "embedded", "concurrency"]
categories = ["no-std", "embedded"]
readme = "README.md"

[dependencies]
heck = { version = "0.5.0", optional = true }
proc-macro2 = { version = "1.0.79", optional = true }
quote = { version = "1.0.35", optional = true }
syn = { version = "2.0.53", features = [
    "extra-traits",
    "full",
], optional = true }
rticx-core = { version = "0.2.0", path = "../../rticx-core", optional = true }
rticx-spsc = { version = "0.2.0", path = "../../rticx-spsc" }

[dev-dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["extra-traits", "full"] }

[features]
# Enable the proc-macro compiler logic. When disabled, the crate is no_std and only exposes runtime exports. 
# This should be enabled only in the inner proc-macro crate within a distribution
proc-macro = [
    "dep:heck",
    "dep:proc-macro2",
    "dep:quote",
    "dep:syn",
    "dep:rticx-core",
]
