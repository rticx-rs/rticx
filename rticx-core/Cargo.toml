[package]
name = "rticx-core"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core procedural macro logic for the RTICX real-time concurrency framework"
keywords = ["rtic", "rticx", "real-time", "embedded", "concurrency"]
categories = ["no-std", "embedded"]
readme = "README.md"

[lib]
# The crate is a proc-macro support library; disable doctests because the
# existing documentation examples assume target-specific crates and types
# that are not available during `cargo test`.
doctest = false

[dependencies]
derive_builder = "0.20.0"
heck = "0.5.0"
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
tempfile = "3.27.0"
thiserror = { workspace = true }
