[package]
name = "rticx-core"
version = "0.1.0"
edition = "2024"
authors = ["Zakaria Madaoui"]
description = "Core procedural macro logic for the RTICX real-time concurrency framework"
license = "MIT"
repository = "https://github.com/rticx-rs/rticx"
homepage = "https://github.com/rticx-rs/rticx/wiki"
keywords = ["rtic", "rticx", "real-time", "embedded", "concurrency"]
categories = ["no-std", "embedded"]
readme = "README.md"

[lib]
# The crate is a proc-macro support library; disable doctests because the
# existing documentation examples assume target-specific crates and types
# that are not available during `cargo test`.
doctest = false

[dependencies]
derive_builder = "0.20.0"
heck = "0.4.1"
proc-macro2 = "1.0.78"
project-root = "0.2.2"
quote = "1.0.35"
syn = { version = "2.0.48", features = ["extra-traits", "full"] }
thiserror = "1.0.63"

[features]
# This feature can be enabled to produce an examples/expanded.rs of a successfully compiled application
debug_expand = []
