name: QEMU

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  qemu:
    name: QEMU playground (cortex-m)
    runs-on: ubuntu-latest
    # Guard against a guest that never reaches its semihosting exit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi,thumbv6m-none-eabi
      - name: Ensure QEMU
        run: |
          if ! command -v qemu-system-arm >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=5 -o Acquire::ForceIPv4=true
            sudo apt-get install -y --no-install-recommends qemu-system-arm
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Run examples under QEMU (cortex-m)
        run: make qemu