name: QEMU

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  qemu:
    name: QEMU playground (cortex-m)
    runs-on: ubuntu-latest
    # Guard against a guest that never reaches its semihosting exit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi,thumbv6m-none-eabi
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - uses: Swatinem/rust-cache@v2
      - name: Run examples under QEMU (cortex-m)
        run: make qemu