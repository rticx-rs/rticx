name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make fmt-check

  clippy:
    name: Clippy warnings as errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: make clippy

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100
      - uses: Swatinem/rust-cache@v2
      - run: make test

  # Compiles the out-of-tree distributions (rticx-riscv / rticx-rp2040)
  # against this core checkout. Advisory: the smoke job inside
  # distro-smoke.yml has continue-on-error, and red during a generation bump
  # is expected until the distro repos opt in (see COMPATIBILITY.md).
  distro-smoke:
    name: Distro smoke (advisory)
    uses: ./.github/workflows/distro-smoke.yml