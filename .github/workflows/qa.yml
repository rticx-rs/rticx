name: QA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  qemu:
    name: QEMU cortex-m-rtic playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: thumbv7m-none-eabi,thumbv6m-none-eabi
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - uses: Swatinem/rust-cache@v2
      - name: Run cortex-m-rtic examples under QEMU (BASEPRI + source-masking)
        run: make qemu
