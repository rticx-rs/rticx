# Standalone experimental workspace for the multi-binary / heterogeneous
# multi-core extension.

[workspace]
resolver = "2"
members = [
    "crates/rticx-xbin-proto",
    "crates/rticx-xbin-pass",
    "crates/rticx-xbin-rt",
    "crates/rticx-xbin-driver",
    # Shared mock distribution used by the checked-in fixtures (the fixtures
    # are standalone workspaces that path-depend on these).
    "crates/mock/rticx-xbin-mock",
    "crates/mock/mock-pac",
    "crates/mock/xbin-mock-capability",
    "crates/mock/xbin-mock-distro",
    "crates/mock/xbin-mock-runtime",
    # STM32H7 (Cortex-M7 + Cortex-M4) cross-binary distribution (M7-T1). Its
    # `no_std` library only compiles for the Cortex-M targets, so it is a
    # member (its macro/bindings share the workspace) but not a default member:
    # build it with `--target` and exactly one of `cm7`/`cm4`.
    "rticx-stm32h7/rticx-stm32h7-bindings",
    "rticx-stm32h7/rticx-stm32h7-macro",
    "rticx-stm32h7",
]

# Everything except the STM32H7 `no_std` library, which cannot be built for
# the host (BASEPRI/MPU are ARMv7-M only); mirrors the root workspace's
# treatment of `rticx-cortex-m`.
default-members = [
    "crates/rticx-xbin-proto",
    "crates/rticx-xbin-pass",
    "crates/rticx-xbin-rt",
    "crates/rticx-xbin-driver",
    "crates/mock/rticx-xbin-mock",
    "crates/mock/mock-pac",
    "crates/mock/xbin-mock-capability",
    "crates/mock/xbin-mock-distro",
    "crates/mock/xbin-mock-runtime",
    "rticx-stm32h7/rticx-stm32h7-bindings",
    "rticx-stm32h7/rticx-stm32h7-macro",
]

[workspace.package]
edition = "2024"
authors = ["Zakaria Madaoui"]
license = "MIT"
repository = "https://github.com/rticx-rs/rticx"
homepage = "https://github.com/rticx-rs/rticx/wiki"

[workspace.dependencies]
# --- external ---
clap = { version = "4.5", features = ["derive"] }
heck = "0.5.0"
# `read` + `std` parse the linked ELF for `cargo xbin build --verify-elf`
# (M6.9-T7); the compression/default features are not needed.
object = { version = "0.39", default-features = false, features = ["read", "std"] }
proc-macro2 = "1.0.79"
quote = "1.0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2.0.53", features = ["extra-traits", "full"] }
thiserror = "1.0.63"
# `preserve_order`: message field declaration order must be preserved by the
# parser -- the canonical layout depends on it.
toml = { version = "0.8.23", features = ["preserve_order"] }
# --- root workspace crates (path + caret version; the version requirement
#     tracks the root generation and is bumped together with out-of-tree
#     distro opt-ins) ---
rticx-core = { path = "../../rticx-core", version = "0.2.0" }
rticx-spsc = { path = "../../rticx-spsc", version = "0.2.0" }
rticx-sw-pass = { path = "../../compilation-passes/rticx-sw-pass", version = "0.2.0" }
# --- experimental crates ---
rticx-xbin-proto = { path = "crates/rticx-xbin-proto", version = "0.1.0" }
rticx-xbin-pass = { path = "crates/rticx-xbin-pass", version = "0.1.0" }
rticx-xbin-rt = { path = "crates/rticx-xbin-rt", version = "0.1.0" }
