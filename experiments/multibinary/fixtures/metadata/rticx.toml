schema = 1

[[application]]
package = "app-m7"
target = { kind = "bin", name = "m7" }
core_ids = [0]

[[application]]
package = "app-m4"
target = { kind = "bin", name = "m4" }
core_ids = [1]

[ipc.regions]
# Both cores see each region at the same absolute address, so the `base`
# shorthand expands to `base_from_source` == `base_from_target`.
"0->1" = { base = 0x30040000, size = 4096 }
"1->0" = { base = 0x30041000, size = 4096 }
