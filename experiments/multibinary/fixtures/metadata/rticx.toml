# No `[ipc.regions]`: since M6.9 the distribution owns IPC memory. This fixture
# binds no distro capability backend, so its manifests carry no capability
# table and `sync` allocates the FIFOs without a pool bound (M6.9-T3). The mock
# capability table reaches the fixtures in M6.9-T9.
