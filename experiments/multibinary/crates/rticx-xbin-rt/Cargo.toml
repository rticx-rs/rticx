[package]
name = "rticx-xbin-rt"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime support for cross-core IPC in the RTICX multi-binary extension"
keywords = ["rtic", "rticx", "ipc", "spsc", "multicore"]
categories = ["no-std", "embedded"]
publish = false

[dependencies]
portable-atomic = { version = "1.15.0", default-features = false }

[dev-dependencies]
# Layout drift guard: the runtime ring must mirror the canonical image computed
# by the host-side allocator.
rticx-xbin-proto = { workspace = true }

[features]
# On by default: the ready bitmap and the epoch counter need
# read-modify-write atomics (`fetch_or`/`fetch_and`/`fetch_add`), which
# targets without native CAS (e.g. Cortex-M0 / thumbv6m, riscv32imc) can only
# provide through `critical-section`. Targets with native CAS ignore the
# fallback. Distributions on CAS-less targets must link a `critical-section`
# implementation; builds using `default-features = false` must re-enable this
# on such targets.
default = ["atomic-critical-section"]
atomic-critical-section = ["portable-atomic/critical-section"]
