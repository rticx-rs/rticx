# No `[ipc.regions]`: since M6.9 the distribution owns IPC memory. This fixture
# binds the mock distribution's capability table through `metadata-macro`
# (M6.9-T9), so its manifests carry the `mock-0-1` pool and `sync` allocates the
# FIFO inside that pool's 4096-byte shared budget.
