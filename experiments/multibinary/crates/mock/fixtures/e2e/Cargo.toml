# End-to-end fixture project (M4-T1).
#
# Standalone workspace, intentionally outside the experimental workspace: it
# models a two-application `cargo xbin` project that builds end to end on the
# host.
#
# - `app-m7` (bin `m7`, global core id 0) declares nothing: the cross-binary
#   pass generates its `EncryptTask` sender stub from the synced view;
# - `app-m4` (bin `m4`, global core id 1) declares the native `#[sw_task]`
#   `EncryptTask` receiver and executes it in a generated doorbell dispatcher;
# - `xbin-mock-distro` is the `#[app]` macro of the shared mock
#   distribution (under `crates/mock/` in the experimental workspace). It runs
#   the full core pass on `MockCoreBackend` and binds the cross-binary pass
#   against `xbin-mock-runtime`, so the generated code compiles and links
#   without target hardware;
# - `xbin-mock-runtime` owns the process-global in-memory pools and provides
#   the receiver-side `RticSwTask` trait;
# - `mock-pac` is an empty PAC stand-in for `device = mock_pac`;
# - the `cargo xbin sync`-generated `ipc_types` module is written to
#   `target/rticx-xbin/ipc_types.rs` and injected into each `#[app]` module by
#   the cross-binary pass (no checked-in crate).
#
# Commanded by `rticx_xbin_driver::build` from
# `crates/rticx-xbin-driver/tests/e2e.rs`.

[workspace]
resolver = "2"
members = [
    "app-m7",
    "app-m4",
]
