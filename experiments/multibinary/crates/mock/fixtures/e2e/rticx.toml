# Project topology of the end-to-end fixture.
#
# `app-m7` owns global core 0 and `app-m4` global core 1; `EncryptTask` is
# spawned by core 0 and runs on core 1.
#
# The project declares no IPC memory: the mock distribution's
# capability binding (reported per application in the metadata manifests) maps
# physical core 0 to physical core 1 through the `mock-0-1` pool, and its
# 4096-byte budget carries the `0->1` FIFO. The mock runtime places the pool in
# process memory and ignores the addresses.
schema = 1

[[application]]
package = "app-m7"
target = { kind = "bin", name = "m7" }
core_id = 0

[[application]]
package = "app-m4"
target = { kind = "bin", name = "m4" }
core_id = 1
