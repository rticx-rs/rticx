# Three-application fixture project (M6-T1).
#
# Standalone workspace, intentionally outside the experimental workspace: it
# models a three-binary `cargo xbin` project that builds end to end on the
# host. The three binaries are fully connected and each one is both a producer
# and a receiver:
#
# - `app-m7` (bin `m7`, global core id 0) declares the `AckTask`/`HeartbeatTask`
#   receivers (spawned by cores 1 and 2) and receives generated stubs for its
#   own `EncryptTask`/`DigestTask` (`0 -> 1`) and `ConfigTask` (`0 -> 2`)
#   spawns;
# - `app-m5` (bin `m5`, global core id 2) declares the `ConfigTask`/`StatusTask`
#   receivers (spawned by cores 0 and 1) and receives generated stubs for its
#   own `SensorTask`/`TelemetryTask` (`2 -> 1`) and `HeartbeatTask` (`2 -> 0`)
#   spawns;
# - `app-m4` (bin `m4`, global core id 1) declares four native `#[sw_task]`
#   receivers on distinct priority lines (two per source core), each with its
#   own `ipc_dispatchers` entry, and produces `AckTask` (`1 -> 0`) and
#   `StatusTask` (`1 -> 2`);
# - `xbin-mock-distro` is the `#[app]` macro of the shared mock
#   distribution (under `crates/mock/` in the experimental workspace). It runs
#   the full core pass on `MockCoreBackend` and binds the cross-binary pass
#   against `xbin-mock-runtime`, so the generated code compiles and links
#   without target hardware;
# - `xbin-mock-runtime` owns the process-global in-memory pools and provides
#   the receiver-side `RticSwTask` trait;
# - `mock-pac` is an empty PAC stand-in for `device = mock_pac`;
# - the `cargo xbin sync`-generated `ipc_types` module is written to
#   `target/rticx-xbin/ipc_types.rs` and injected into each `#[app]` module by
#   the cross-binary pass (no checked-in crate).
#
# Commanded by `rticx_xbin_driver::build` from
# `crates/rticx-xbin-driver/tests/three_app.rs`.

[workspace]
resolver = "2"
members = [
    "app-m7",
    "app-m5",
    "app-m4",
]
