# Project topology of the three-application fixture (M6-T1).
#
# Three cores, each owning one binary, in a fully connected cross-binary
# topology:
#
# - `app-m7` owns global core 0, `app-m4` global core 1, `app-m5` global core 2;
# - the mock distribution's capability binding maps every pair of physical
#   cores through its own pool (`mock-0-1`, `mock-1-2`, `mock-0-2`), so both
#   directions of each pair allocate inside that pool's shared 4096-byte budget
#   (M6.9-T4);
# - every application is therefore both a producer (it spawns tasks on the two
#   other cores through generated stubs) and a receiver (it declares its own
#   `#[sw_task]` cross-binary receivers, each on a priority line disjoint from
#   the other source core's lines).
#
# The `0->1` and `2->1` directions carry two FIFOs each
# (`EncryptTask`/`DigestTask` and `SensorTask`/`TelemetryTask`). The mock
# runtime places the pools in process memory and ignores the addresses.
schema = 1

[[application]]
package = "app-m7"
target = { kind = "bin", name = "m7" }
core_ids = [0]

[[application]]
package = "app-m5"
target = { kind = "bin", name = "m5" }
core_ids = [2]

[[application]]
package = "app-m4"
target = { kind = "bin", name = "m4" }
core_ids = [1]
